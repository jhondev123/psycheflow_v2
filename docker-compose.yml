# Ambiente de desenvolvimento: banco + API + front. O jeito fácil é o script `./dev.sh` (ver `./dev.sh help`).
#   docker compose up -d --build --wait   -> tudo (front http://localhost:5173 · API http://localhost:8080/scalar)
#   docker compose up -d db               -> só o banco (API via `dotnet run`, front via `npm run dev`)
#   docker compose watch --no-up          -> reconstrói API/front ao salvar o código (com tudo já no ar)
# Copie .env.example para .env antes do primeiro uso (o dev.sh faz isso sozinho).
name: psycheflow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psycheflow}
      POSTGRES_USER: ${POSTGRES_USER:-psycheflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./Psycheflow.Api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB:-psycheflow};Username=${POSTGRES_USER:-psycheflow};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Defina JWT_KEY no .env}
      Database__MigrateOnStartup: "true"
      Cors__AllowedOrigins__0: ${FRONT_URL:-http://localhost:5173}
      Storage__Path: /app/storage
      # IA (opcional): só os provedores com chave ficam disponíveis para as clínicas.
      Ai__Claude__ApiKey: ${ANTHROPIC_API_KEY:-}
      Ai__OpenAi__ApiKey: ${OPENAI_API_KEY:-}
      Ai__Gemini__ApiKey: ${GEMINI_API_KEY:-}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - api-storage:/app/storage
    # Mesmo teste do Dockerfile, mas checando a cada 2 s na subida para o `--wait` liberar logo.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s
    develop:
      watch:
        - action: rebuild
          path: ./Psycheflow.Api/src/Psycheflow.Api
          ignore: [bin/, obj/]

  web:
    # Front React (build de produção servido pelo Nginx).
    build:
      context: ./Psycheflow.Front
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8080}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONT_PORT:-5173}:80"
    develop:
      watch:
        - action: rebuild
          path: ./Psycheflow.Front/src

volumes:
  postgres-data:
  api-storage:
