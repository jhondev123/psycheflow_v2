# Ambiente de desenvolvimento.
#   docker compose up -d          -> banco + API (http://localhost:8080/scalar)
#   docker compose up -d db       -> só o banco (API via `dotnet run`)
# Copie .env.example para .env antes do primeiro uso.
name: psycheflow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psycheflow}
      POSTGRES_USER: ${POSTGRES_USER:-psycheflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB:-psycheflow};Username=${POSTGRES_USER:-psycheflow};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Defina JWT_KEY no .env}
      Database__MigrateOnStartup: "true"
      Cors__AllowedOrigins__0: ${FRONT_URL:-http://localhost:5173}
      Storage__Path: /app/storage
      # IA (opcional): só os provedores com chave ficam disponíveis para as clínicas.
      Ai__Claude__ApiKey: ${ANTHROPIC_API_KEY:-}
      Ai__OpenAi__ApiKey: ${OPENAI_API_KEY:-}
      Ai__Gemini__ApiKey: ${GEMINI_API_KEY:-}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - api-storage:/app/storage

  web:
    # Front React (build de produção servido pelo Nginx).
    build:
      context: ../Psycheflow.Front
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8080}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONT_PORT:-5173}:80"

volumes:
  postgres-data:
  api-storage:
